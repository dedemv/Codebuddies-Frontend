<div class="tela-login">
  <div class="card-login">
    <div class="mascote-boas-vindas">🤖</div>
    <h1>CodeBuddies</h1>
    <p class="subtitulo">Vamos aprender tecnologia brincando!</p>

    <!-- Critério de Aceitação CA01: Sessão fechada -->
    @if (!sessaoAberta) {
      <div class="alerta-aguardando">
        <span class="icone-relogio">⏳</span>
        <h2>Aguardando professor iniciar a aula</h2>
      </div>
    }

    <!-- Formulário de Login Simples (RF-P01) -->
    @if (sessaoAberta) {
      <form (ngSubmit)="entrar()" class="formulario">
        <label for="nome">Qual é o seu nome?</label>
        <input 
          id="nome" 
          type="text" 
          [(ngModel)]="nome" 
          name="nome" 
          placeholder="Escreva seu nome..." 
          autocomplete="off" />

        <label for="idade">Quantos anos você tem?</label>
        <input 
          id="idade" 
          type="number" 
          [(ngModel)]="idade" 
          name="idade" 
          min="5" 
          max="8" 
          placeholder="Ex: 6" />

        @if (erroMensagem) {
          <div class="alerta-erro">
            ⚠️ {{ erroMensagem }}
          </div>
        }

        <button type="submit" class="btn-entrar">COMEÇAR A JOGAR! 🚀</button>
      </form>
    }

    <div class="rodape-professor">
      <a routerLink="/professor/login">Área do Professor</a>
    </div>
  </div>
</div>
